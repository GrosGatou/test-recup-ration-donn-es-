<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Données Capteur DHT22</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-bottom: 30px;
        }
        .data {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            min-width: 150px;
        }
        .value {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }
        .label {
            font-size: 18px;
            opacity: 0.9;
        }
        .timestamp {
            margin-top: 20px;
            opacity: 0.8;
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ Capteur DHT22 - ESP32</h1>
        <div class="data">
            <div class="card">
                <div class="label">Température</div>
                <div class="value" id="temperature">--</div>
                <div class="label">°C</div>
            </div>
            <div class="card">
                <div class="label">Humidité</div>
                <div class="value" id="humidity">--</div>
                <div class="label">%</div>
            </div>
        </div>
        <div class="timestamp" id="timestamp">Chargement...</div>
        <div class="error" id="error" style="display: none;"></div>
    </div>

    <script>
        const API_URL = 'https://qa3lqiwgh4.execute-api.eu-north-1.amazonaws.com/prod';

        async function fetchSensorData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                document.getElementById('temperature').textContent = data.temperature.toFixed(1);
                document.getElementById('humidity').textContent = data.humidity.toFixed(1);
                
                const date = new Date(data.timestamp);
                document.getElementById('timestamp').textContent = 
                    `Dernière mise à jour : ${date.toLocaleString('fr-FR')}`;
                
                document.getElementById('error').style.display = 'none';
            } catch (error) {
                document.getElementById('error').textContent = 
                    'Erreur de chargement des données';
                document.getElementById('error').style.display = 'block';
                console.error('Erreur:', error);
            }
        }

        // Charger les données au démarrage
        fetchSensorData();
        
        // Actualiser toutes les 10 secondes
        setInterval(fetchSensorData, 10000);
    </script>
</body>
</html>
